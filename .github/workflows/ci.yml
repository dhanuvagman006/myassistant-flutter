name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - run: flutter pub get

      # Firebase client config is gitignored; CI gets it from the repo
      # secret so the debug build compiles exactly like a local one.
      - name: Write google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # Warnings are fatal on purpose — the tree stays warning-clean.
      # Style infos (prefer_const etc.) are advisory, not build-breakers.
      - run: flutter analyze --no-fatal-infos

      # No test suite exists yet; add `flutter test` back when it does.

      - run: flutter build apk --debug
