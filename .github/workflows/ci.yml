name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - run: flutter pub get

      # Warnings are fatal on purpose — the tree stays warning-clean.
      # Style infos (prefer_const etc.) are advisory, not build-breakers.
      - run: flutter analyze --no-fatal-infos

      # No test suite exists yet; add `flutter test` back when it does.

      - run: flutter build apk --debug
