name: myassistant
description: MYASSISTANT — AI personal assistant for Android and iOS.
publish_to: 'none'
version: 0.2.99+119

environment:
  # Color.withValues() (used throughout lib/design) requires Dart 3.6 / Flutter 3.27+
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking — talks to the backend only; AI keys never live in the app
  http: ^1.2.2
  # Live mode: bidirectional audio stream to the backend /live proxy.
  web_socket_channel: ^3.0.1
  http_parser: ^4.0.2   # MediaType for vision multipart uploads

  # Brand typography — Sora (headlines) + Inter (body) per UI Design V1.0
  google_fonts: ^6.2.1

  # Voice — wake word watch + speech capture + spoken replies (A2, M1)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0        # OFFLINE FALLBACK voice only

  # Cloud neural TTS playback — plays the warm Gemini voice (WAV from the
  # backend /tts endpoint). flutter_tts stays as an offline fallback.
  audioplayers: ^6.1.0

  # NOTE: there is no wake word today. Porcupine was removed (2026-09-12) —
  # it was declared but never imported, so it only added native weight.
  # VoiceService still carries an STT-based wake-word helper, but nothing
  # calls it: the app is tap-to-talk. Re-add a wake engine when that changes.

  # Local storage for session + cached config
  shared_preferences: ^2.3.2

  # Gyroscope — 3D parallax tilt + dynamic light/shadow on cards (GyroTilt)
  sensors_plus: ^6.1.0

  # Coarse location, for location-aware answers ("weather here").
  geolocator: ^13.0.1

  # Cloud speech-to-text (Whisper via backend /stt) — records the
  # question as m4a; auto language detection, replaces flaky on-device
  # regional recognition. Device STT stays as wake word + fallback.
  record: ^6.1.1
  path_provider: ^2.1.4

  # Group B — camera/gallery photos and PDF picking (B1–B4)
  image_picker: ^1.1.2
  file_picker: ^8.1.4

  # Voice calling — read contacts + place calls ("Hey Hari, call amma")
  flutter_contacts: ^1.1.9+2
  flutter_phone_direct_caller: ^2.1.1

  # Incoming-call guard — the moment the phone rings, Hari stops
  # speaking instantly and releases the mic (READ_PHONE_STATE runtime
  # permission on Android; CallKit observer on iOS, no permission).
  phone_state: ^2.0.1
  permission_handler: ^11.3.1

  # Reminder notifications — fire even when the app is closed.
  # PINNED to 19.x: v18 still REQUIRES uiLocalNotificationDateInterpretation
  # (removed in 19), and v20+ has further breaking changes — our
  # notification_service.dart is written against the v19 zonedSchedule API.
  flutter_local_notifications: ">=19.0.0 <20.0.0"
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1

  url_launcher: ^6.3.0
           # opens App Store on iOS

  # Sign-in (F1) — email + Google + Apple, verified by the backend
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  flutter_secure_storage: ^9.2.2   # session token lives in Keystore/Keychain
  local_auth: ^2.3.0               # F1 — fingerprint/face app lock (PIN fallback is ours)
  share_plus: ^10.1.2              # F2 export sharing + J3 share-anywhere drafts

  video_player: ^2.9.2
  # "Send messages as you" (2026-09-26): the 30-second identity video is
  # recorded IN the app, front camera, with the script scrolling over the
  # preview. image_picker's video capture hands the screen to the system
  # camera (no teleprompter possible) and would let a gallery clip in.
  camera: ^0.12.1
  livekit_client: ^2.4.9           # avatar video: subscribes to the BEY track
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1             # phone OTP: proves the number is theirs
  firebase_messaging: ^16.6.0
  firebase_app_installations: ^0.4.3
  flutter_sound: ^9.28.0
  sherpa_onnx: ^1.13.7
  receive_sharing_intent: ^1.9.0
  package_info_plus: ^9.0.1
  open_filex: ^4.7.0
  crypto: ^3.0.7
  convert: ^3.1.2
  device_info_plus: ^12.4.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The on-phone frame benchmark (integration_test/ux_bench_test.dart,
  # run with test_driver/perf_driver.dart in profile mode). Ships with the
  # Flutter SDK; not built into the release app.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # A fake front camera drives the identity recorder in its tests.
  camera_platform_interface: ^2.14.0
  # ...and a fake player its review, and the saved video's preview.
  video_player_platform_interface: ^6.9.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/icon_fg.png

flutter:
  uses-material-design: true

  # GPU programs for the always-moving pictures (lib/design/gpu_programs.dart).
  # impellerc compiles them with the app, for every renderer the phone
  # might use; each widget still has its Canvas painter to fall back on.
  shaders:
    - shaders/voice_backdrop.frag
    - shaders/siri_orb.frag
    - shaders/ambient.frag

  assets:
    - assets/icon/
    - assets/sounds/
    - assets/wake/
    # Manrope + Space Grotesk, every weight, so text never starts in a
    # fallback font and swaps (lib/core/bundled_fonts.dart).
    - assets/google_fonts/
    # Birthday cards (2026-09-26): Noto Serif Display for the wording, and
    # Noto Serif Malayalam / Devanagari so "ജന്മദിനാശംസകൾ" is drawn by a
    # font we ship, not whatever the phone has. All OFL (OFL-Noto.txt);
    # loaded by lib/features/poster/poster_fonts.dart.
    - assets/poster_fonts/
    # On-device speaker-ID model (sherpa-onnx CAM++ zh/en) — voice
    # enrollment + owner-only listening. Runs fully offline.
    - assets/models/
