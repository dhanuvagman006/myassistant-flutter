name: myassistant
description: MYASSISTANT — AI personal assistant for Android and iOS.
publish_to: 'none'
version: 0.1.0+1

environment:
  # Color.withValues() (used throughout lib/design) requires Dart 3.6 / Flutter 3.27+
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking — talks to the backend only; AI keys never live in the app
  http: ^1.2.2
  # Live mode: bidirectional audio stream to the backend /live proxy.
  web_socket_channel: ^3.0.1
  http_parser: ^4.0.2   # MediaType for vision multipart uploads

  # Brand typography — Sora (headlines) + Inter (body) per UI Design V1.0
  google_fonts: ^6.2.1

  # Voice — wake word watch + speech capture + spoken replies (A2, M1)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0        # OFFLINE FALLBACK voice only

  # Cloud neural TTS playback — plays the warm Gemini voice (WAV from the
  # backend /tts endpoint). flutter_tts stays as an offline fallback.
  audioplayers: ^6.1.0

  # Screen-off wake word: on-device detection (Porcupine). NOTE: the mic
  # foreground service (flutter_foreground_task) was REMOVED for now — its
  # hard-coded Java 1.8 broke builds on AGP 9. Wake word works while the
  # app is open; screen-off listening returns when the plugin ships a fix.
  porcupine_flutter: ^3.0.4

  # Local storage for session + cached config
  shared_preferences: ^2.3.2

  # Gyroscope — 3D parallax tilt + dynamic light/shadow on cards (GyroTilt)
  sensors_plus: ^6.1.0

  # Regional language from location (Karnataka -> Kannada etc.)
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Cloud speech-to-text (Whisper via backend /stt) — records the
  # question as m4a; auto language detection, replaces flaky on-device
  # regional recognition. Device STT stays as wake word + fallback.
  record: ^6.1.1
  path_provider: ^2.1.4

  # Group B — camera/gallery photos and PDF picking (B1–B4)
  image_picker: ^1.1.2
  file_picker: ^8.1.4

  # Voice calling — read contacts + place calls ("Hey Hari, call amma")
  flutter_contacts: ^1.1.9+2
  flutter_phone_direct_caller: ^2.1.1

  # Incoming-call guard — the moment the phone rings, Hari stops
  # speaking instantly and releases the mic (READ_PHONE_STATE runtime
  # permission on Android; CallKit observer on iOS, no permission).
  phone_state: ^2.0.1
  permission_handler: ^11.3.1

  # Real-time human avatar (Tavus CVI) rendered in a WebView
  webview_flutter: ^4.10.0

  # Reminder notifications — fire even when the app is closed.
  # PINNED to 19.x: v18 still REQUIRES uiLocalNotificationDateInterpretation
  # (removed in 19), and v20+ has further breaking changes — our
  # notification_service.dart is written against the v19 zonedSchedule API.
  flutter_local_notifications: ">=19.0.0 <20.0.0"
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1

  url_launcher: ^6.3.0           # opens App Store on iOS

  # Sign-in (F1) — email + Google + Apple, verified by the backend
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  flutter_secure_storage: ^9.2.2   # session token lives in Keystore/Keychain
  local_auth: ^2.3.0               # F1 — fingerprint/face app lock (PIN fallback is ours)
  share_plus: ^10.1.2              # F2 export sharing + J3 share-anywhere drafts

  # FACE MODE — D-ID streaming avatar rendered in a server-hosted page;
  # the WebView is the window, the words come from our own backend.

  # Daily video briefing playback (D-ID-rendered mp4 from the backend)
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0E1B1D"
  adaptive_icon_foreground: assets/icon/icon_fg.png

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/wake/
    # Optional licensed portraits (assistant_female.jpg / assistant_male.jpg).
    # The app runs without them — AssistantFace falls back automatically.
    - assets/avatar/
